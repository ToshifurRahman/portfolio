<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Toshifur Rahman, software engineer. Backend and full-stack systems designed for the moment they fail. Case studies: Relay and RannaGhor."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Toshifur Rahman, Software Engineer</title>
    <!-- Share card. The canonical link, og:url and the absolute image are added
         by the pre-render (scripts/head-origin.mjs) from `siteOrigin` in
         src/content.ts: while that constant is empty none of the three is
         emitted, so no absolute URL is invented for an undecided host. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Toshifur Rahman" />
    <meta property="og:title" content="Toshifur Rahman, Software Engineer" />
    <meta
      property="og:description"
      content="Backend and full-stack systems designed for the moment they fail. Two case studies: Relay and RannaGhor."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Toshifur Rahman, Software Engineer: I build backend and full-stack systems, and I design for the moment they fail." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Toshifur Rahman, Software Engineer" />
    <meta
      name="twitter:description"
      content="Backend and full-stack systems designed for the moment they fail. Two case studies: Relay and RannaGhor."
    />
    <meta name="twitter:image" content="/og.png" />
    <meta name="twitter:image:alt" content="Toshifur Rahman, Software Engineer: I build backend and full-stack systems, and I design for the moment they fail." />
    <!-- The theme is set before the first paint: the stored choice, else the
         system preference, else dark. Without JavaScript the stylesheet follows
         the system preference on its own. -->
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The build pre-renders the markup above, so the page is complete before
         the bundle runs. This forces that markup to be laid out first: without
         it the browser may defer the first layout into the module's own task,
         which puts the 293 kB bundle on the LCP critical path in Lantern's
         model (1.21 s simulated instead of 0.61 s) in roughly one run in three. -->
    <script>
      document.documentElement.getBoundingClientRect();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
