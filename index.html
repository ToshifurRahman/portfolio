<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Toshifur Rahman, software engineer. Backend and full-stack systems designed for the moment they fail. Case studies: Ticket-Pipeline and RannaGhor."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Toshifur Rahman, Software Engineer</title>
    <!-- Share card. og:url and an absolute og:image wait for a real site URL;
         the deploy host is not decided, so both stay relative. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Toshifur Rahman" />
    <meta property="og:title" content="Toshifur Rahman, Software Engineer" />
    <meta
      property="og:description"
      content="Backend and full-stack systems designed for the moment they fail. Two case studies: Ticket-Pipeline and RannaGhor."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Toshifur Rahman, Software Engineer, and the seven sections of the site as a chain." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Toshifur Rahman, Software Engineer" />
    <meta
      name="twitter:description"
      content="Backend and full-stack systems designed for the moment they fail. Two case studies: Ticket-Pipeline and RannaGhor."
    />
    <meta name="twitter:image" content="/og.png" />
    <meta name="twitter:image:alt" content="Toshifur Rahman, Software Engineer, and the seven sections of the site as a chain." />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
